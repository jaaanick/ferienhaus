<!doctype html>

<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Der Ferienhauser</title>
<script>
/* GitHub Pages kennt /ferienhaus/<Code> nicht als Datei: Code an die App weiterreichen */
(function(){
  var base="/ferienhaus/", p=location.pathname;
  var code=p.indexOf(base)===0?p.slice(base.length).split("/")[0]:"";
  location.replace(base+(code?"?c="+encodeURIComponent(decodeURIComponent(code)):"")+location.hash);
})();
</script>
</head>
